<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alfaiataria Contemporânea</title>

    <!-- Google Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>

        :root {
            --primary-gold: #0b1f3a;
            --primary-gold-hover: #17365f;
            --dark-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: rgba(11, 31, 58, 0.20);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: #111111;
            min-height: 100vh;
        }

        /* Navbar Estilizada */

        .navbar-custom {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-logo {
            max-width: 50px;
            height: 50px;
            width: 50px;
            object-fit: cover;
        }

        .brand-text {
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #111111;
            font-size: 1.1rem;
        }

        .nav-link {
            color: #555555 !important;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary-gold) !important;
        }

        /* Banner */

        .welcome-card {
            background: #f7f7f7;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .welcome-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(11, 31, 58, 0.08);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Cards de roupas — mesmo estilo dos cards de referência */

        .car-card {
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            opacity: 0.92;
        }

        .car-img-wrapper {
            position: relative;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: #f2f1ee;
            border-radius: 14px 14px 0 0;
        }

        .car-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            display: block;
        }

        .card-body-custom {
            padding: 0.9rem 0 0 0;
            display: flex;
            flex-direction: column;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .product-title {
            font-size: 0.9rem;
            color: #444444;
            font-weight: 400;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-title-row i.bi-heart {
            font-size: 1.05rem;
            color: #111111;
            flex-shrink: 0;
            cursor: pointer;
        }

        .product-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111111;
            margin-top: 6px;
        }

        /* Botões */

        .btn-gold {
            background: var(--primary-gold);
            border: none;
            color: #ffffff;
            font-weight: 700;
            border-radius: 10px;
            padding: 10px 20px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-gold:hover {
            background: var(--primary-gold-hover);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(11, 31, 58, 0.25);
            transform: translateY(-2px);
        }

        .btn-outline-gold {
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            background: transparent;
            font-weight: 600;
            border-radius: 10px;
            padding: 9px 18px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-outline-gold:hover {
            background: var(--primary-gold);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .spec-item {
            font-size: 0.85rem;
            color: #666666;
        }

        .spec-item i {
            color: var(--primary-gold);
        }

    </style>

</head>

<body>

    <!-- Menu Navegação -->

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">

        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2" href="#">

                <img src="logobabilonica.jpeg" alt="Logo Alfaiataria Contemporânea" class="brand-logo">
                <span class="brand-text">ALFAIATARIA CONTEMPORÂNEA</span>

            </a>

            <!-- Perfil do Usuário -->

            <div class="d-flex align-items-center gap-3">

                <div class="text-end d-none d-sm-block">

                    <div class="fw-bold small"
                        style="color:#111111;"
                        id="nomeUsuarioExibicao">

                        Cliente

                    </div>

                    <span class="badge"
                        style="font-size: 0.65rem;
                        background-color: var(--primary-gold) !important;
                        color: #fff;">

                        CLIENTE EXCLUSIVO

                    </span>

                </div>

                <a href="sitetop.html"
                    class="btn btn-outline-dark btn-sm rounded-circle p-2"
                    title="Sair da Conta">

                    <i class="bi bi-box-arrow-right"></i>

                </a>

            </div>

        </div>

    </nav>


    <!-- Conteúdo Principal -->

    <main class="container my-5">


        <!-- Banner de Boas-Vindas -->

        <section class="welcome-card mb-5">

            <div class="row align-items-center">

                <div class="col-lg-8">

                    <span class="text-uppercase tracking-wider small fw-bold"
                        style="color: var(--primary-gold);">

                        Coleção Contemporânea

                    </span>

                    <h1 class="h2 fw-bold mt-1"
                        style="color:#111111;">

                        Bem-vindo à
                        Alfaiataria Contemporânea

                    </h1>

                </div>

            </div>

        </section>


        <section>

            <div class="row g-4">

                <!-- Peça 1 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion8.jpeg" alt="Blazer Noir">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Blazer Noir</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 499,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 2 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion9.jpeg" alt="Calça Marine">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Calça Marine</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 299,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 3 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion10.jpeg" alt="Camisa social branca">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Camisa Blanche</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 219,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 4 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion11.jpeg" alt="Colete preto de alfaiataria">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Conjunro Élégance</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 259,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 5 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion12.jpeg" alt="Conjunto azul-marinho de alfaiataria">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Conjunto Royal</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 649,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 6 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion13.jpeg" alt="Vestido preto elegante">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Conjunto Duquesa</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 429,90</span>
                        </div>
                    </div>
                </div>

            </div>

        </section>


    </main>


    <!-- Scripts Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
