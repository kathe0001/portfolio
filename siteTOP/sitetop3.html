<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alto Verão</title>

    <!-- Google Fonts & Bootstrap 5 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>

        :root {
            --primary: #0b1f3a;
            --primary-hover: #17365f;
            --dark-bg: #ffffff;
            --card-bg: #ffffff;
            --border-color: rgba(11, 31, 58, 0.20);
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--dark-bg);
            color: #111111;
            min-height: 100vh;
        }

        .navbar-custom {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
        }

        .clothing-symbol {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-weight: 700;
        }

        .nav-link {
            color: #555555 !important;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--primary) !important;
        }

        .welcome-card {
            background: #f7f7f7;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
        }

        .welcome-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(11, 31, 58, 0.08);
            filter: blur(80px);
            border-radius: 50%;
            pointer-events: none;
        }

        /* ---- CARDS (estilo referência: imagem grande e o restante minimalista) ---- */

        .car-card {
            background: transparent;
            border: none;
            border-radius: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            opacity: 0.92;
        }

        /* object-fit: cover preenche o card por completo, igual à referência.
           Como são fotos com fundos diferentes (não é still de estúdio), a
           foto pode perder um pouco das bordas — troque "cover" por "contain"
           logo abaixo se preferir ver a foto inteira em vez de preencher tudo. */
        .car-img-wrapper {
            position: relative;
            aspect-ratio: 3 / 4;
            overflow: hidden;
            background: #f2f1ee;
            border-radius: 14px 14px 0 0;
        }

        .car-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-body-custom {
            padding: 0.9rem 0 0 0;
            display: flex;
            flex-direction: column;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .card-title-row .product-title {
            font-size: 0.9rem;
            color: #444444;
            font-weight: 400;
            margin: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card-title-row i.bi-heart {
            font-size: 1.05rem;
            color: #111111;
            flex-shrink: 0;
        }

        .product-price {
            font-size: 0.95rem;
            font-weight: 700;
            color: #111111;
            margin-top: 6px;
        }

    </style>

</head>

<body>

    <!-- Menu Navegação -->

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">

        <div class="container">

            <a class="navbar-brand d-flex align-items-center gap-2" href="#">

                <div class="clothing-symbol">
                    AV
                </div>

            </a>

            <!-- Perfil do Usuário -->

            <div class="d-flex align-items-center gap-3">

                <div class="text-end d-none d-sm-block">

                    <div class="fw-bold small" style="color:#111111;" id="nomeUsuarioExibicao">
                        Cliente
                    </div>

                    <span class="badge"
                        style="font-size: 0.65rem; background-color: var(--primary) !important; color: #fff;">
                        CLIENTE EXCLUSIVO
                    </span>

                </div>

                <a href="sitetop.html" class="btn btn-outline-dark btn-sm rounded-circle p-2" title="Sair da Conta">
                    <i class="bi bi-box-arrow-right"></i>
                </a>

            </div>

        </div>

    </nav>

    <!-- Conteúdo Principal -->

    <main class="container my-5">

        <!-- Banner de Boas-Vindas -->

        <section class="welcome-card mb-5">

            <div class="row align-items-center">

                <div class="col-lg-8">

                    <span class="text-uppercase small fw-bold" style="color: var(--primary);">
                        Coleção Alto Verão
                    </span>

                    <h1 class="h2 fw-bold mt-1" style="color:#111111;">
                        Bem-vindo à Coleção Alto Verão
                    </h1>

                </div>

            </div>

        </section>

        <section>

            <div class="row g-4">

                <!-- Peça 1 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion3.jpeg" alt="Conjunto de linho areia">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Conjunto Linho Areia</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 329,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 2 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion1.jpeg" alt="Conjunto camisa e shorts branco">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Conjunto Alfaiataria Branco</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 349,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 3 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion2.jpeg" alt="Camisa listrada azul">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Camisa Riviera</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 219,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 4 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion4.jpeg" alt="Conjunto Jardim verde">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Conjunto Jardim</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 399,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 5 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion5.jpeg" alt="Vestido bege com vivo caramelo">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Vestido Solar</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 279,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 6 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion6.jpeg " alt="Vestido longo estampa floral azul">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Vestido Floral Azul</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 359,90</span>
                        </div>
                    </div>
                </div>

                <!-- Peça 7 -->
                <div class="col-md-6 col-lg-4">
                    <div class="car-card">
                        <div class="car-img-wrapper">
                            <img src="fashion7.jpeg" alt="Vestido longo estampa floral verde">
                        </div>
                        <div class="card-body-custom">
                            <div class="card-title-row">
                                <p class="product-title">Vestido Floral Verde</p>
                                <i class="bi bi-heart"></i>
                            </div>
                            <span class="product-price">R$ 349,90</span>
                        </div>
                    </div>
                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
